<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE 10 SONG RAY BULL PLAYLIST</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #ffffff;
            color: #000000;
            line-height: 1.4;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid #000;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .date {
            font-size: 12px;
            color: #666;
        }
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .track-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 24px;
        }
        .track-header {
            display: flex;
            gap: 16px;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .track-num {
            font-size: 12px;
            color: #666;
            min-width: 24px;
        }
        .track-meta {
            font-size: 14px;
            font-weight: 600;
        }
        .artist {
            font-weight: 400;
            color: #444;
            margin-left: 6px;
        }
        .dsp-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
            margin-left: 40px;
            font-size: 11px;
            text-transform: uppercase;
        }
        .dsp-links a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #000;
            padding-bottom: 1px;
        }
        .dsp-links a:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>THE 10 SONG RAY BULL PLAYLIST UPDATED EVERY FRIDAY</h1>
        <div class="date" id="update-date">Loading...</div>
    </header>

    <main>
        <div class="track-list" id="tracks-container">
            <!-- Dynamically populated -->
        </div>
    </main>

    <script>
        fetch('tracks.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('update-date').textContent = data.updated;
                const container = document.getElementById('tracks-container');
                container.innerHTML = '';

                data.tracks.forEach(track => {
                    const item = document.createElement('div');
                    item.className = 'track-item';
                    item.innerHTML = `
                        <div class="track-header">
                            <span class="track-num">${track.number}</span>
                            <div class="track-meta">
                                <span>${track.title}</span><span class="artist">— ${track.artist}</span>
                            </div>
                        </div>
                        <div class="dsp-links">
                            ${track.tidal ? `<a href="${track.tidal}" target="_blank">Tidal</a>` : ''}
                            ${track.apple ? `<a href="${track.apple}" target="_blank">Apple Music</a>` : ''}
                            ${track.qobuz ? `<a href="${track.qobuz}" target="_blank">Qobuz</a>` : ''}
                            ${track.youtube ? `<a href="${track.youtube}" target="_blank">YouTube</a>` : ''}
                            ${track.spotify ? `<a href="${track.spotify}" target="_blank">Spotify</a>` : ''}
                            ${track.bandcamp ? `<a href="${track.bandcamp}" target="_blank">Bandcamp</a>` : ''}
                        </div>
                    `;
                    container.appendChild(item);
                });
            });
    </script>
</body>
</html>
