name: Deploy via LFTP SFTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via SFTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" -e "
          set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no';
          open sftp://${{ secrets.FTP_SERVER }}:22;
          cd /playlist.raybullstudio.com/;
          put admin.html;
          put index.html;
          put tracks.json;
          bye
          "
