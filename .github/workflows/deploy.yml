name: Deploy Playlist via SFTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SFTP Upload
        uses: jakejarvis/sftp-action@v5
        with:
          hostname: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          remote_path: /playlist.raybullstudio.com/
        env:
          SSH_PRIVATE_KEY: ""
