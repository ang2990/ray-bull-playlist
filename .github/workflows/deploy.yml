name: Deploy Playlist via Native rsync over SFTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Sync files via rsync over port 22
        env:
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          sshpass -p "$SFTP_PASSWORD" rsync -avz -e "ssh -p 22 -o StrictHostKeyChecking=no" --exclude='.git/' --exclude='.github/' ./ "$SFTP_USER@$SFTP_HOST:/home/dh_45wnm8/playlist.raybullstudio.com/"
