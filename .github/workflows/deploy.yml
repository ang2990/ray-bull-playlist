name: Deploy Playlist via Native SFTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts

      - name: Upload files via SFTP
        run: |
          sftp -P 22 -o "User=${{ secrets.FTP_USERNAME }}" -o "PasswordAuthentication=yes" ${{ secrets.FTP_SERVER }} << 'EOF'
          cd /playlist.raybullstudio.com/
          put admin.html
          put index.html
          put tracks.json
          bye
          EOF
        env:
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
